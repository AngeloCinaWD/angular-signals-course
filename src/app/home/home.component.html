<div class="courses-panel">
  <h3>All Courses</h3>

  <mat-tab-group>
    <mat-tab label="Beginners">
      <!-- in ogni tab importiamo il CourseCardListComponent per visualizzare i corsi -->
      <!-- gli passiamo i corsi filtrati per categoria all'input signal -->
      <courses-card-list [courses]="beginnerCourses()"></courses-card-list>
    </mat-tab>

    <mat-tab label="Advanced">
      <courses-card-list [courses]="advancedCourses()"></courses-card-list>
    </mat-tab>
  </mat-tab-group>
</div>
